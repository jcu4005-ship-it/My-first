name: Verify staging site

# 배포된 스테이징 사이트에서 실제 흐름을 자동 검증합니다 (DB 구조는 바꾸지 않음).
#  - 수동 실행만, 입력란에 "staging" 입력 필요
#  - GitHub Environment "staging-verify"의 값만 사용 (DB 비밀번호·접속 주소 없음)
#  - 테스트 계정은 서버 비밀키로 만들고(닉네임 stg…), 비밀번호는 실행마다 무작위
#  - 테스트용 관리자 권한은 실행 후 회수
#  - 요청 기록(trace)·화면 보고서는 남기지 않고, 접근 보호 우회 값이 출력물에 없는지 마지막에 검사
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '스테이징을 검증하려면 staging 을 입력하세요'
        required: true
      expect_samples:
        description: '샘플 데이터를 넣었다면 yes (샘플 모임 화면 검사 포함)'
        required: false
        default: 'no'

permissions:
  contents: read

concurrency:
  group: verify-staging
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.inputs.confirm == 'staging'
    runs-on: ubuntu-latest
    environment: staging-verify
    timeout-minutes: 20
    env:
      TEST_TARGET: staging
      TEST_APP_URL: ${{ vars.STAGING_APP_URL }}
      TEST_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      TEST_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      TEST_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
      TEST_EXPECT_SAMPLES: ${{ github.event.inputs.expect_samples }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 설정 확인
        run: |
          for v in TEST_APP_URL TEST_SUPABASE_URL TEST_SUPABASE_PUBLISHABLE_KEY TEST_SUPABASE_SECRET_KEY VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::$v 가 staging-verify Environment에 없습니다 (docs/STAGING_SETUP.md)"; exit 1; fi
          done
          case "$TEST_APP_URL" in https://*) ;; *) echo "::error::STAGING_APP_URL은 https:// 로 시작해야 합니다"; exit 1;; esac
          if [ -n "$PRODUCTION_SUPABASE_URL" ] && [ "$TEST_SUPABASE_URL" = "$PRODUCTION_SUPABASE_URL" ]; then
            echo "::error::검증 대상이 운영 Supabase입니다. 중단합니다."; exit 1
          fi
      - run: npm ci
      - name: "배포 상태 확인 (/api/health)"
        run: |
          body=$(curl -sS --fail -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$TEST_APP_URL/api/health")
          echo "$body"
          node -e '
            const h = JSON.parse(process.argv[1]);
            const problems = [];
            if (h.appEnv !== "staging") problems.push(`appEnv=${h.appEnv} (staging 이어야 함)`);
            if (h.paymentMode !== "test") problems.push(`paymentMode=${h.paymentMode}`);
            if (h.livePaymentsEnabled !== false) problems.push("livePaymentsEnabled");
            if (!h.integrations?.supabase) problems.push("Supabase 미연결");
            if (!h.integrations?.supabaseServer) problems.push("서버 비밀키(SUPABASE_SECRET_KEY) 미설정");
            if (problems.length) { console.error("::error::" + problems.join(", ")); process.exit(1); }
            const sha = process.env.GITHUB_SHA.slice(0, 7);
            if (h.commit && h.commit !== sha) console.log(`::warning::배포된 커밋(${h.commit})과 이 실행의 커밋(${sha})이 다릅니다. Vercel 배포가 끝났는지 확인하세요.`);
          ' "$body"
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: "스테이징 E2E: 상태 코드·권한·호스트 신청·승인·모임 등록·신청·테스트 결제·환불·호스트 취소·탈퇴·비밀키 노출"
        run: npx playwright test 2>&1 | tee staging-e2e.log
      - name: 접근 보호 우회 값·비밀키가 출력물에 없는지 확인
        if: always()
        run: |
          for v in VERCEL_AUTOMATION_BYPASS_SECRET TEST_SUPABASE_SECRET_KEY; do
            if grep -rqF -- "${!v}" staging-e2e.log test-results 2>/dev/null; then
              echo "::error::$v 값이 테스트 출력물에서 발견되었습니다"; exit 1
            fi
          done
          echo "출력물에 비밀 값 없음"
